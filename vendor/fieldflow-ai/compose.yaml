# Internal-network deployment on the VPS.
# Secrets come ONLY from the gitignored .env file (never baked into the image).
services:
  ai:
    build: .
    image: fieldflow-ai:0.1.0
    container_name: fieldflow-ai
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    # Host binding is loopback-only for local debugging. Remove this block on
    # the VPS if nothing outside the internal network needs to reach the AI
    # service — the backend calls it over the internal network by service name.
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||4100)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
    external: true
    name: fieldflow_internal
