name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All tests run against injected stubs; CI never calls AI Grid.
      - run: npm test

  smoke-real-model:
    if: ${{ vars.RUN_AI_GRID_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Call the configured AI Grid model once
        env:
          LLM_API_KEY: ${{ secrets.AI_GRID_API_KEY }}
          LLM_MODEL: Qwen/Qwen3.8-27B
        run: npm run smoke
